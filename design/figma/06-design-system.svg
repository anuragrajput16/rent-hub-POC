<rect x="64" y="636" width="720" height="200" rx="14" fill="#FFFFFF" stroke="#D5DDCF" stroke-width="1"/>
<text x="88" y="700" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="34" font-weight="700" fill="#18241E" text-anchor="start">Bricolage Grotesque</text>
<text x="88" y="728" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#5C6D62" text-anchor="start">.display — headings and numerals only, tight tracking</text>
<text x="88" y="784" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#18241E" text-anchor="start">Inter for everything else. Rent due on the 5th.</text>
<text x="88" y="812" font-family="Inter, sans-serif" font-size="13.5" font-weight="400" fill="#5C6D62" text-anchor="start">Sentence case, Indian English, no exclamation marks. Prices via inr(): ₹48,500.</text>
