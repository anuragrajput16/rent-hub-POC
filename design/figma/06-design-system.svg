<text x="1170.8799999999999" y="748" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500" fill="#5C6D62" text-anchor="start">StatusPill ok · wait · rented · muted</text>
<text x="840" y="792" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#5C6D62" text-anchor="start">Also: PageHead, SectionTitle, StatCard, EmptyState, Field + inputClass, ErrorNote, Chip, VerifiedBadge,</text>
<text x="840" y="811" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#5C6D62" text-anchor="start">Avatar, Modal, SuccessModal.</text>
<text x="64" y="900" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="24" font-weight="650" fill="#18241E" text-anchor="start">Page rules</text>
<circle cx="68" cy="929.05" r="3" fill="#1E4634"/>
<text x="80" y="934" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#18241E" text-anchor="start">Every list has an EmptyState with a next action — empty is a state, not a blank area.</text>
<circle cx="68" cy="957.05" r="3" fill="#1E4634"/>
<text x="80" y="962" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#18241E" text-anchor="start">Async buttons show a working label (Booking…, Sending…) and disable while busy.</text>
<circle cx="68" cy="985.05" r="3" fill="#1E4634"/>
<text x="80" y="990" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#18241E" text-anchor="start">Confirmations use SuccessModal, which carries the &quot;no real money moved&quot; line.</text>
<circle cx="68" cy="1013.05" r="3" fill="#1E4634"/>
<text x="80" y="1018" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#18241E" text-anchor="start">Mobile first; the sidebar becomes a drawer under lg. Icons are inline SVG, 24 × 24, currentColor.</text>
<circle cx="68" cy="1041.05" r="3" fill="#1E4634"/>
<text x="80" y="1046" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#18241E" text-anchor="start">Anything mocked says so where a user would otherwise assume it is real.</text>
</svg>
