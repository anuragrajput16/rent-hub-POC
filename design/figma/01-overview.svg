<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<rect x="0" y="0" width="1600" height="1180" fill="#E7EDE3"/>
<text x="64" y="72" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#CE8A22" text-anchor="start" letter-spacing="1.5">RENTEASE · PROJECT GUIDE</text>
<text x="64" y="122" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="44" font-weight="700" fill="#18241E" text-anchor="start">What RentEase is</text>
<text x="64" y="158" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#5C6D62" text-anchor="start">An India-focused rental platform, built as a clickable proof of concept. Owners list homes, renters find, tour and rent them, and everyone can set the home up through a</text>
<text x="64" y="184" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#5C6D62" text-anchor="start">marketplace on top of the rental flow. Everything runs in the browser; the backend is mocked.</text>
<text x="64" y="250" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="24" font-weight="650" fill="#18241E" text-anchor="start">Three roles, three demo accounts</text>
<text x="64" y="278" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#5C6D62" text-anchor="start">Any password works. The role pill in the top bar hops between these accounts instantly.</text>
